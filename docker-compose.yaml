services:
  storage-init:
    image: prom/prometheus:v3.13.2
    user: "0:0"
    entrypoint: ["/bin/sh", "/usr/local/bin/init-storage.sh"]
    command: []
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
    environment:
      INIT_LOG_STORAGE: "false"
    volumes:
      - ./scripts/init-storage.sh:/usr/local/bin/init-storage.sh:ro
      - "${PROMETHEUS_DATA_DIR:-${MONITORING_DATA_DIR:+${MONITORING_DATA_DIR}/}prometheus-data}:/prometheus"
      - "${GRAFANA_DATA_DIR:-${MONITORING_DATA_DIR:+${MONITORING_DATA_DIR}/}grafana-storage}:/var/lib/grafana"
    restart: "no"

  node-exporter:
    container_name: node-exporter
    image: prom/node-exporter:v1.12.1
    pid: host
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    restart: unless-stopped

  process-exporter:
    container_name: process-exporter
    image: ncabatoff/process-exporter:0.8.7
    user: "0"
    pid: host
    cap_add:
      - SYS_PTRACE
    command:
      - '--procfs=/host/proc'
      - '--config.path=/etc/process-exporter/config.yml'
      - '--threads=false'
      - '--gather-smaps=false'
    volumes:
      - /proc:/host/proc:ro
      - ./process-exporter/config.yml:/etc/process-exporter/config.yml:ro
    restart: unless-stopped

  prometheus:
    container_name: prometheus
    image: prom/prometheus:v3.13.2
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-180d}'
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro
      - "${PROMETHEUS_DATA_DIR:-${MONITORING_DATA_DIR:+${MONITORING_DATA_DIR}/}prometheus-data}:/prometheus"
    depends_on:
      storage-init:
        condition: service_completed_successfully
    restart: unless-stopped

  grafana:
    container_name: grafana
    image: grafana/grafana:13.1.2
    ports:
      - "3000:3000"
    environment:
      - GF_DASHBOARDS_MIN_REFRESH_INTERVAL=1s
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER in the environment or .env}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in the environment or .env}
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider http://localhost:3000/api/health || exit 1" ]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
    volumes:
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/provisioning/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./grafana/provisioning/optional/loki-disabled.yml:/etc/grafana/provisioning/datasources/loki.yml:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - "${GRAFANA_DATA_DIR:-${MONITORING_DATA_DIR:+${MONITORING_DATA_DIR}/}grafana-storage}:/var/lib/grafana"
    depends_on:
      storage-init:
        condition: service_completed_successfully
      prometheus:
        condition: service_started
    restart: unless-stopped

volumes:
  prometheus-data:
    name: prometheus-data
  grafana-storage:
    name: grafana-storage
